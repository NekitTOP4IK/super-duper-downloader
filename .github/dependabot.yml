version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: daily
    groups:
      python-deps:
        patterns: ["*"]
        exclude-patterns: ["yt-dlp"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # A new Python minor needs a re-locked environment and a .python-version bump, done by hand.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
