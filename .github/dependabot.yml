version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: daily
    groups:
      python-deps:
        patterns: ["*"]
        exclude-patterns: ["yt-dlp"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # A new Python minor needs a re-locked environment and a .python-version bump, done by hand.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-deps:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Dependabot offers the newest major even when it is not LTS or already end-of-life.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /deploy/egress
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
