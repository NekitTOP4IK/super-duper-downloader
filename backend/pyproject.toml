[project]
name = "super-duper-downloader-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arq>=0.28.0",
    "fastapi>=0.156.0",
    "httpx[socks]>=0.28.1",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[default,curl-cffi]>=2026.8.19",
    "zipstream-ng>=1.9.3",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["network: talks to real external sites"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
