x-backend: &backend
  build: ./backend
  image: sdd-backend:dev
  env_file: .env
  environment:
    # Bind mounts from a Windows host don't deliver inotify events, so file watchers must poll.
    WATCHFILES_FORCE_POLLING: "true"
  volumes:
    - ./backend/app:/app/app
    - data:/data
  depends_on:
    - redis
    - cobalt

# Workers open user-supplied URLs, so they only get the network the egress firewall guards.
x-worker: &worker
  <<: *backend
  network_mode: service:egress
  depends_on:
    redis:
      condition: service_started
    cobalt:
      condition: service_started
    egress:
      condition: service_healthy
      restart: true

services:
  api:
    <<: *backend
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"

  # arq --watch restarts the worker inside the same process, so edited modules would never load.
  worker:
    <<: *worker
    command: watchfiles --filter python "arq app.worker.main.DownloadWorker" app

  probe-worker:
    <<: *worker
    command: watchfiles --filter python "arq app.worker.main.ProbeWorker" app

  egress:
    build: ./deploy/egress
    image: sdd-egress:dev
    init: true
    # Applies to this container's own network only, which the workers join.
    cap_add:
      - NET_ADMIN
    environment:
      EGRESS_ALLOW_CIDRS: ${EGRESS_ALLOW_CIDRS:-}
      EGRESS_DENY_CIDRS: ${EGRESS_DENY_CIDRS:-}
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 30s
      start_period: 30s
      start_interval: 1s

  redis:
    image: redis:8.0-alpine

  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    init: true
    read_only: true
    environment:
      API_URL: http://cobalt:9000/
      RATELIMIT_MAX: "1000"
      TUNNEL_RATELIMIT_MAX: "1000"

volumes:
  data:
