x-backend: &backend
  build: ./backend
  image: ${BACKEND_IMAGE:-sdd-backend:local}
  env_file: .env
  volumes:
    - data:/data
  depends_on:
    - redis
    - cobalt
  restart: unless-stopped

# Workers open user-supplied URLs, so they only get the network the egress firewall guards.
x-worker: &worker
  <<: *backend
  network_mode: service:egress
  depends_on:
    redis:
      condition: service_started
    cobalt:
      condition: service_started
    egress:
      condition: service_healthy
      restart: true

services:
  caddy:
    build: ./frontend
    image: ${WEB_IMAGE:-sdd-web:local}
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

  api:
    <<: *backend

  worker:
    <<: *worker
    command: arq app.worker.main.DownloadWorker

  probe-worker:
    <<: *worker
    command: arq app.worker.main.ProbeWorker

  egress:
    build: ./deploy/egress
    image: ${EGRESS_IMAGE:-sdd-egress:local}
    init: true
    # Applies to this container's own network only, which the workers join.
    cap_add:
      - NET_ADMIN
    environment:
      EGRESS_ALLOW_CIDRS: ${EGRESS_ALLOW_CIDRS:-}
      EGRESS_DENY_CIDRS: ${EGRESS_DENY_CIDRS:-}
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 30s
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  redis:
    image: redis:8.0-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    init: true
    read_only: true
    environment:
      API_URL: http://cobalt:9000/
      DURATION_LIMIT: ${MAX_DURATION_SEC:-10800}
      # All requests come from our own workers' IP, so cobalt's default 20 req/min limit would throttle us.
      RATELIMIT_MAX: "1000"
      TUNNEL_RATELIMIT_MAX: "1000"
    restart: unless-stopped

volumes:
  data:
  caddy_data:
  caddy_config:
